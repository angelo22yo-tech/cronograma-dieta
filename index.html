
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
document.getElementById('upd').onclick = async function () {
  this.textContent = 'Atualizando...';
  try {
    var r = await navigator.serviceWorker.getRegistrations();
    for (var x of r) await x.unregister();
    var k = await caches.keys();
    for (var n of k) await caches.delete(n);
  } catch (e) {}
  location.reload();
};
