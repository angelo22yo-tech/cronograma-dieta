<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Cronograma</title>
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2937;--mut:#6b7280;--bd:#e5e7eb;
--eat:#16a34a;--water:#0284c7;--fast:#dc2626;--med:#9333ea;--sleep:#475569;--prep:#d97706;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#334155}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#334155}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
.clock{text-align:center;color:var(--mut);font-size:1rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:20px;margin-bottom:14px}
.ringwrap{position:relative;width:260px;max-width:80vw;margin:0 auto}
svg{width:100%;height:auto;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--bd);stroke-width:14}
.prg{fill:none;stroke:var(--c);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .8s linear}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mid .ic{font-size:2.6rem}
.mid .cd{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--c)}
.mid .lb{font-size:.85rem;color:var(--mut)}
h1{font-size:1.5rem;margin:16px 0 4px;text-align:center}
.q{text-align:center;font-size:1.15rem;font-weight:600;color:var(--c);margin:0 0 8px}
.d{font-size:1.05rem;line-height:1.5;margin:0;text-align:center}
.range{text-align:center;color:var(--mut);margin-top:8px;font-size:.95rem}
.next{display:flex;gap:12px;align-items:center}
.next .ic{font-size:2rem}
.next b{display:block;font-size:1.05rem}
.next span{color:var(--mut);font-size:.9rem}
h2{font-size:1rem;color:var(--mut);margin:20px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border-left:5px solid var(--c);background:var(--card);margin-bottom:6px;font-size:.95rem}
.row .h{font-variant-numeric:tabular-nums;color:var(--mut);min-width:96px;font-size:.85rem}
.row.past{opacity:.45}
.row.now{outline:2px solid var(--c);font-weight:700}
.sleep{--c:var(--sleep)}.eat{--c:var(--eat)}.water{--c:var(--water)}.fast{--c:var(--fast)}.med{--c:var(--med)}.prep{--c:var(--prep)}
</style>
</head>
<body>
<main>
<div class="clock" id="clock"></div>
<div class="card" id="cur">
  <div class="ringwrap">
    <svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle class="prg" id="prg" cx="60" cy="60" r="52"/></svg>
    <div class="mid"><div class="ic" id="ic"></div><div class="cd" id="cd"></div><div class="lb">restantes</div></div>
  </div>
  <h1 id="nm"></h1>
  <p class="q" id="qt"></p>
  <p class="d" id="ds"></p>
  <div class="range" id="rg"></div>
</div>
<div class="card next" id="nx"></div>
<h2>Cronograma de hoje</h2>
<div id="list"></div>
</main>
<script>
var P=[
["00:00","05:00","sleep","🛌","Hora de dormir","Gravidade e posição","Cama inclinada em 15 cm e deitada estritamente para o lado esquerdo."],
["05:00","09:00","med","💊","Remédio da tireoide","Apenas 1 gole sutil de água","Tomar às 05:00 com o menor volume possível. Ficar um pouco mais sentada na cama. Depois, aguardar até as 09:00."],
["09:00","09:30","eat","🥣","Gel de farelo de aveia","200 ml de água morna + 2 colheres (sopa) de farelo","Feito na panela ou caneca. Primeira carga de água e fibras protetoras do dia."],
["09:30","10:00","eat","🍽️","Café da manhã","Torrada de pão caseiro + 1 ovo sem óleo + alface + 150 ml de chá de camomila","O chá é o líquido do café. Mastigar cada garfada 30 vezes."],
["10:00","11:30","fast","🚫","Jejum de líquidos","Zero água","Proibido beber qualquer coisa neste período."],
["11:30","12:15","water","💧","Hidratação da manhã","300 ml de água pura (1 copo grande)","Golinhos: 3 a 4 goles a cada 10 minutos. Nunca virar o copo de uma vez."],
["12:15","12:30","prep","⏳","Prepare o almoço","Faltam poucos minutos","Sem líquidos. Hora de se organizar para o almoço."],
["12:30","13:00","eat","🍽️","Almoço","Arroz + feijão (pouco caldo) + 1 ou 2 ovos cozidos amassados + alface com 1 colher (chá) de azeite cru","ZERO LÍQUIDOS: sem água, sem suco, sem chá."],
["13:00","15:00","fast","🚫","Jejum de líquidos","Zero água","Tempo para o almoço ser digerido sem flutuar no estômago."],
["15:00","16:00","water","💧","Hidratação da tarde","400 ml de água pura (cerca de 2 copos médios)","Goles calmos ao longo desta hora."],
["16:00","16:15","prep","⏳","Prepare o lanche","Faltam poucos minutos","Sem líquidos. Hora de se organizar para o lanche."],
["16:15","16:30","eat","🍌","Lanche da tarde","1 banana-prata bem madura amassada + 1 colher (sobremesa) de farelo de aveia","Sem líquidos."],
["16:30","19:30","fast","🚫","Jejum de líquidos","Zero água","Intervalo longo para o estômago chegar vazio ao jantar."],
["19:30","20:00","eat","🍽️","Jantar","Prato raso: arroz + feijão seco + 1 ovo cozido amassado","Sem azeite à noite e ZERO LÍQUIDOS."],
["20:00","22:30","fast","🚫","Jejum total","Zero água e zero comida","Duas horas e meia de descanso absoluto do sistema digestivo."],
["22:30","22:45","prep","⏳","Prepare o gel noturno","Faltam poucos minutos","Sem líquidos. Hora de ir para a cozinha."],
["22:45","23:00","eat","🥣","Gel de aveia noturno","200 ml de água morna + 2 colheres (sopa) de farelo","Feito na panela. Última hidratação do dia, em forma de gel."],
["23:00","24:00","fast","🚫","Jejum pós-aveia","Zero água","Se a boca secar, fazer apenas bochecho e cuspir."]
].map(function(a){function m(t){var x=t.split(":");return +x[0]*60+ +x[1]}return{s:m(a[0]),e:m(a[1]),st:a[0],et:a[1]=="24:00"?"00:00":a[1],t:a[2],i:a[3],n:a[4],q:a[5],d:a[6]}});
var $=function(i){return document.getElementById(i)},C=2*Math.PI*52;
$("prg").style.strokeDasharray=C;
function pad(n){return String(n).padStart(2,"0")}
function render(){
 var d=new Date(),sec=d.getHours()*3600+d.getMinutes()*60+d.getSeconds(),now=sec/60;
 $("clock").textContent=d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})+" · "+pad(d.getHours())+":"+pad(d.getMinutes());
 var k=0;P.forEach(function(p,j){if(now>=p.s&&now<p.e)k=j});
 var p=P[k],n=P[(k+1)%P.length],left=Math.max(0,Math.round(p.e*60-sec)),frac=(p.e*60-sec)/((p.e-p.s)*60);
 var cur=$("cur");cur.className="card "+p.t;
 $("prg").style.strokeDashoffset=C*(1-Math.min(1,Math.max(0,frac)));
 $("ic").textContent=p.i;
 var h=Math.floor(left/3600),mi=Math.floor(left%3600/60),s=left%60;
 $("cd").textContent=h>0?h+"h "+pad(mi)+"min":pad(mi)+":"+pad(s);
 $("nm").textContent=p.n;$("qt").textContent=p.q;$("ds").textContent=p.d;
 $("rg").textContent="Das "+p.st+" às "+p.et;
 var nx=$("nx");nx.className="card next "+n.t;
 nx.innerHTML='<div class="ic">'+n.i+'</div><div><span>A seguir, às '+n.st+'</span><b>'+n.n+'</b><span>'+n.q+'</span></div>';
 var L=$("list"),html="";
 P.forEach(function(x,j){html+='<div class="row '+x.t+(j<k?" past":"")+(j==k?" now":"")+'"><span class="h">'+x.st+"–"+x.et+'</span><span>'+x.i+" "+x.n+'</span></div>'});
 if(L.dataset.k!=k){L.innerHTML=html;L.dataset.k=k}
}
render();setInterval(render,1000);
</script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
